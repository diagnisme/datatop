name: 🔄 PR Automation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read
  issues: write

jobs:
  pr-checks:
    name: Enforce PR Requirements
    runs-on: ubuntu-latest
    if: github.event.pull_request != null
    steps:
      - name: Validate PR target branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            // Check if PR targets correct branch
            if (pr.base.ref === 'main' && pr.head.ref.startsWith('feat/')) {
              github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `⚠️ **Branch Policy Reminder**

This PR targets \`main\` from a feature branch.

**Standard workflow:**
1. Feature branches → \`develop\` (first)
2. \`develop\` → \`main\` (production)

Consider:
- [ ] Merging to \`develop\` first for staging
- [ ] Running full tests on \`develop\`
- [ ] Creating separate PR: \`develop\` → \`main\`

This helps maintain stable production releases! 🚀`
              });
            }

      - name: Add labels based on branch
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const labels = [];

            if (pr.head.ref.startsWith('feat/')) labels.push('feature');
            if (pr.head.ref.startsWith('fix/')) labels.push('bug-fix');
            if (pr.head.ref.startsWith('perf/')) labels.push('performance');
            if (pr.head.ref.startsWith('docs/')) labels.push('documentation');

            if (pr.base.ref === 'main') labels.push('release');
            if (pr.base.ref === 'develop') labels.push('staging');

            if (labels.length > 0) {
              github.rest.issues.addLabels({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            }

      - name: Request review from team
        uses: actions/github-script@v7
        if: github.event.pull_request.draft == false
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Auto-request review (can be configured with team)
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Automated Review Started**

✅ Quality checks running...
🔍 Copilot AI review in progress...

Status updates will appear below.`
            });
